    namelist filename: ./fv3jedi/fmsmpp.nml
    field table filename: ./fv3jedi/field_table
  akbk: ./fv3jedi/akbk.nc4
  layout:
  - 8
  - 8
  npx: 97
  npy: 97
  npz: 127
time window:
  begin: '2022-01-19T15:00:00Z'
  length: PT6H
  bound to include: begin
increment variables:
- eastward_wind
- northward_wind
- layer_thickness
- air_pressure_thickness
- air_temperature
- air_pressure_at_surface
- water_vapor_mixing_ratio_wrt_moist_air
- cloud_liquid_ice
- cloud_liquid_water
- snow_water
- rain_water
- graupel
- ozone_mass_mixing_ratio
background:
  datetime: '2022-01-19T18:00:00Z'
  members from template:
    template:
      datetime: '2022-01-19T18:00:00Z'
      filetype: cube sphere history
      provider: ufs
      state variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - layer_thickness
      - air_pressure_thickness
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - snow_water
      - rain_water
      - graupel
      - cloud_ice_number_concentration
      - rain_number_concentration
      - ozone_mass_mixing_ratio
      - geopotential_height_at_surface
      - slmsk
      - sheleg
      - skin_temperature_at_surface
      - vtype
      - stype
      - vfrac
      - soilt
      - soilm
      - totalSnowDepthMeters
      - eastward_wind_at_surface
      - northward_wind_at_surface
      - f10m
      field io names:
        eastward_wind: ugrd
        northward_wind: vgrd
        air_temperature: tmp
        layer_thickness: delz
        air_pressure_thickness: dpres
        air_pressure_at_surface: pressfc
        water_vapor_mixing_ratio_wrt_moist_air: spfh
        cloud_liquid_ice: icmr
        cloud_liquid_water: clwmr
        snow_water: snmr
        rain_water: rwmr
        graupel: grle
        cloud_ice_number_concentration: nccice
        rain_number_concentration: nconrd
        ozone_mass_mixing_ratio: o3mr
        geopotential_height_at_surface: hgtsfc
        slmsk: land
        sheleg: weasd
        skin_temperature_at_surface: tmpsfc
        stype: sotyp
        vfrac: veg
        totalSnowDepthMeters: snod
        eastward_wind_at_surface: ugrd_hyblev1
        northward_wind_at_surface: vgrd_hyblev1
        soilm: soilw1
        soilt: soilt1
      datapath: ./bkg/mem%mem%
      filename is datetime templated: true
      filenames:
      - enkfgdas.t12z.cubed_sphere_grid_atmf006.nc
      - enkfgdas.t12z.cubed_sphere_grid_sfcf006.nc
      max allowable geometry difference: 1e-4
    pattern: '%mem%'
    nmembers: 80
    zero padding: 3
observations:
  observers:
  - obs space:
      name: sondes_ps_tsen
      obsdatain:
        engine:
          type: H5File
          obsfile: /scratch4/BMC/arfs-psl/Bo.Huang/expCodes/Workflow/EnKFOnly-20251031/TestGWSetupRealCase/tmp/RUNDIRS/TestGW-EnKFOnlyGSINCDiag-JEDI-MEM80-T9/enkfgdas.2022011918/enkfgdasatmensanl_18/obs/gdas.t18z.sondes_ps_tsen.nc
          missing file action: warn
        obsgrouping:
          group variables:
          - stationIdentification
          sort variable: pressure
          sort order: descending
      obsdataout:
        engine:
          type: H5File
          obsfile: /scratch4/BMC/arfs-psl/Bo.Huang/expCodes/Workflow/EnKFOnly-20251031/TestGWSetupRealCase/tmp/RUNDIRS/TestGW-EnKFOnlyGSINCDiag-JEDI-MEM80-T9/enkfgdas.2022011918/enkfgdasatmensanl_18/diags/diag_lobs_sondes_ps_tsen_2022011918.nc
      io pool:
        max pool size: 24
      simulated variables:
      - stationPressure
      distribution:
        name: RoundRobin
        halo size: 1250e3
    obs operator:
      name: Composite
      components:
      - name: SfcCorrected
        variables:
        - name: stationPressure
        correction scheme to use: GSL
        geovar_sfc_geomz: geopotential_height_at_surface
        geovar_geomz: geopotential_height
    linear obs operator:
      name: Composite
      components:
      - name: Identity
        variables:
        - name: stationPressure
    obs filters:
    - filter: PreQC
      filter variables:
      - name: stationPressure
      maxvalue: 0
      action:
        name: reject
    - filter: Background Check
      filter variables:
      - name: stationPressure
      threshold: 5.0
      action:
        name: reject
    obs localizations:
    - localization method: Horizontal Gaspari-Cohn
